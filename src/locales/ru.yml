rules:
  title: "Правила игры"
  storyTitle: "Сюжет"
  storyText1: "Полицейские проводят рейды на мафию, но нужно, чтобы рейды были неожиданными. В рядах полиции завелись \"кроты\" (работающие на мафию)."
  storyText2: "Полицейским надо, чтобы крот не попал в группу для проведения рейда. Если крот попал в рейд, он может предупредить мафию, и рейд провалится."
  storyText3: "Цель полицейских - успешно провести 3 из 5 рейдов."
  storyText4: "Цель кротов - сорвать 3 из 5 рейдов."
  mechanicsTitle: "Механики"
  mechanics1: "В игре 5 раундов (рейдов)."
  mechanics2: "Количество игроков: от 5 до 8."
  mechanics3: "2 команды: Полицейские и Кроты."
  mechanics4: "Кроты в начале игры знают друг друга в лицо. Полицейские не знают ролей других игроков."
  phasesTitle: "Фазы раунда"
  phase1Title: "1. Обсуждение:"
  phase1Text: "Игроки общаются и решают, кого брать в рейд."
  phase2Title: "2. Предложение команды:"
  phase2Text: "Игроки по очереди (по кругу) предлагают состав команды на рейд. Игрок может пропустить свой ход (это не влияет на счетчик отказов)."
  phase3Title: "3. Голосование за команду:"
  phase3Text: "Все игроки голосуют за предложенный состав (\"За\" или \"Против\"). Для принятия нужно строгое большинство (например, при 6 игроках нужно 4 голоса \"За\", 3 голоса - это отказ). Если команда отвергнута, право предложить состав переходит к следующему игроку. Лимит отказов: Если подряд отвергнуто столько вариантов, сколько всего игроков в матче, Кроты немедленно выигрывают всю игру."
  phase4Title: "4. Рейд:"
  phase4Text: "Если команда утверждена, выбранные игроки отправляются в рейд. Кроты в составе команды тайно выбирают: \"Предать\" (саботировать рейд) или \"Не предать\" (поддержать рейд). Полицейские в составе команды обязаны \"Не предать\". Если хотя бы один игрок выбрал \"Предать\", рейд считается проваленным (очко Кротам). Исключение: В некоторых раундах при большом количестве игроков (7-8) для провала рейда требуется 2 голоса \"Предать\". После рейда всем сообщается общее количество голосов \"Предать\", но не кто именно их отдал."
  balanceTitle: "Баланс"
  balance1: "5 игроков (2 крота): размеры команд 2-3-2-3-3"
  balance2: "6 игроков (2 крота): размеры команд 2-3-4-3-4"
  balance3: "7 игроков (3 крота): размеры команд 2-3-3-4*-4"
  balance4: "8 игроков (3 крота): размеры команд 3-4-4-5*-5"
  balanceAsterisk: "* - рейд может быть выигран мафией (провален), только если как минимум 2 крота выбрали \"Предать\"."
