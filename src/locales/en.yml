rules:
  title: "Game Rules"
  storyTitle: "Story"
  storyText1: "The police are conducting raids on the mafia, but the raids must be a surprise. There are \"moles\" (working for the mafia) in the police ranks."
  storyText2: "The police need to ensure that no mole gets into the raid group. If a mole gets into a raid, they can warn the mafia, and the raid will fail."
  storyText3: "The goal of the police is to successfully conduct 3 out of 5 raids."
  storyText4: "The goal of the moles is to ruin 3 out of 5 raids."
  mechanicsTitle: "Mechanics"
  mechanics1: "There are 5 rounds (raids) in the game."
  mechanics2: "Number of players: from 5 to 8."
  mechanics3: "2 teams: Police Officers and Moles."
  mechanics4: "Moles know each other by sight at the start of the game. Police Officers do not know the roles of other players."
  phasesTitle: "Round Phases"
  phase1Title: "1. Discussion:"
  phase1Text: "Players talk and decide who to take on the raid."
  phase2Title: "2. Team Proposal:"
  phase2Text: "Players take turns (in a circle) proposing a team composition for the raid. A player can skip their turn (this does not affect the rejection counter)."
  phase3Title: "3. Voting on the Team:"
  phase3Text: "All players vote on the proposed composition (\"Approve\" or \"Reject\"). Strict majority is required for approval (for example, with 6 players, 4 \"Approve\" votes are needed, 3 votes mean rejection). If the team is rejected, the right to propose a team passes to the next player. Rejection limit: If a number of proposals equal to the total number of players in the match are rejected in a row, the Moles immediately win the entire game."
  phase4Title: "4. Raid:"
  phase4Text: "If the team is approved, the selected players go on the raid. Moles on the team secretly choose: \"Sabotage\" (betray the raid) or \"Support\" (support the raid). Police Officers on the team must \"Support\". If at least one player chooses \"Sabotage\", the raid is considered failed (a point for the Moles). Exception: In some rounds with a large number of players (7-8), 2 \"Sabotage\" votes are required to fail the raid. After the raid, everyone is told the total number of \"Sabotage\" votes, but not exactly who cast them."
  balanceTitle: "Balance"
  balance1: "5 players (2 moles): team sizes 2-3-2-3-3"
  balance2: "6 players (2 moles): team sizes 2-3-4-3-4"
  balance3: "7 players (3 moles): team sizes 2-3-3-4*-4"
  balance4: "8 players (3 moles): team sizes 3-4-4-5*-5"
  balanceAsterisk: "* - the raid can only be won by the mafia (failed) if at least 2 moles choose \"Sabotage\"."
